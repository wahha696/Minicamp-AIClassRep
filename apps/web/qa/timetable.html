<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课表视觉验收（合成数据）</title></head>
<body style="margin:16px;background:#f8fafc;font:14px system-ui;color:#0f172a">
  <h1>课表视觉验收（仅开发服务器）</h1>
  <p>真实 iframe 视口验证 390px 手机布局；640px 视口以 CSS 200% 放大检查重排。浏览器原生 200% 缩放仍需发布前验证。</p>
  <h2>390px 手机视口</h2>
  <iframe title="390px 手机课表" src="./timetable-case.html" width="390" height="844" style="max-width:100%;border:1px solid #cbd5e1"></iframe>
  <h2>640px 视口 · CSS 200% 放大</h2>
  <iframe title="200% 放大课表" src="./timetable-case.html" width="640" height="600" style="zoom:2;border:1px solid #cbd5e1"></iframe>
</body></html>

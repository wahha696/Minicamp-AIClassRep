name: security

on:
  push:
    branches: [main, codex/**, feat/**]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL · JavaScript / TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  dependency-review:
    name: 新增依赖审查
    # GitHub 未启用 Dependency Graph 时官方 action 会直接报错，和依赖是否安全无关。
    # 管理员启用 Dependency Graph 后，再把仓库 Actions 变量设为 DEPENDENCY_REVIEW_ENABLED=true。
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  production-audit:
    name: 生产依赖漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --registry=https://registry.npmjs.org --prod --audit-level high

# 发布流水线（问题 4 + 修复计划 3.3）：推 v* 标签（或手动触发）→ Windows 打包 → 传 release。
# 步骤：装依赖 → 类型检查+测试 → 构建 → 准备 napcat/（仓库已随提交带一份；缺失时用
# scripts/fetch-napcat.mjs 下载官方 Release 并按 napcat.version.json 校验 SHA-256）→
# node scripts/pack.mjs（下 node.exe + 组装 + 压缩）→ 上传 release/ClassRep.zip 到 GitHub Release。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 要写权限

jobs:
  release:
    name: 打包 Windows 免安装版并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 版本取自根 package.json 的 packageManager 字段（pnpm@10.34.5）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 验证（类型检查 + 测试，发布前最后一道闸）
        run: |
          pnpm typecheck
          pnpm test

      - name: 构建（esbuild + vite）
        run: pnpm -r build

      - name: 补齐 NapCat 运行包（仓库已带；缺失时按 napcat.version.json 下载并校验 SHA-256）
        run: node scripts/fetch-napcat.mjs

      - name: 打包 Windows 免安装包
        run: node scripts/pack.mjs
        # API Key 不打进包里（修复计划 3.2）：用户首次启动在向导页填，CI 也不读 .env.release。

      - name: 打标版本号（用 tag 改写包内 version.json）
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $p = 'release/ClassRep/app/version.json'
          if (Test-Path $p) {
            $j = Get-Content $p -Raw | ConvertFrom-Json
            $j.version = $tag.TrimStart('v')
            $j | ConvertTo-Json | Set-Content $p -Encoding UTF8
          }

      - name: 创建/更新 GitHub Release 并上传
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ClassRep ${{ github.ref_name }}
          files: release/ClassRep.zip
          generate_release_notes: true
